name: Dev Build and Publish

on:
  push:
    branches:
      - dev

jobs:
  dev-publish:
    runs-on: ubuntu-22.04
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install build tools
        run: |
          uv tool install build
          uv tool install twine
          
      - name: Get base version and create dev version
        id: get_version
        run: |
          BASE_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          DEV_VERSION="${BASE_VERSION}.dev${{ github.run_number }}"
          echo "version=${DEV_VERSION}" >> $GITHUB_OUTPUT
          echo "Base version: ${BASE_VERSION}"
          echo "Dev version: ${DEV_VERSION}"
          
      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.get_version.outputs.version }}"/' pyproject.toml
          
      - name: Install project dependencies
        run: uv sync --dev
          
      - name: Build package
        run: uv tool run build
          
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uv tool run twine upload dist/*
          
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Development Release v${{ steps.get_version.outputs.version }}"
          body: |
            🚀 Development release v${{ steps.get_version.outputs.version }}
            
            This is an automated development build from the `dev` branch.
            
            **Changes:**
            - Built from commit: ${{ github.sha }}
            - Run number: ${{ github.run_number }}
            
            **Installation:**
            ```bash
            pip install fastapi-keycloak-middleware==${{ steps.get_version.outputs.version }}
            ```
          files: dist/*
          prerelease: true
          generate_release_notes: true